# =============================================================================
# Reverse proxy for the AI Orchestrator: serves the built SPA and proxies the
# API (/api), live status WebSockets (/ws) and API docs to the backend.
# =============================================================================

upstream backend {
    server backend:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # To enable HTTPS: uncomment the 443 server below, mount certificates into
    # /etc/nginx/certs, and replace this block's body with:
    #   return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/app.locations;
}

