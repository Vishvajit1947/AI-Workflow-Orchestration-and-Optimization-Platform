# =============================================================================
# AI Workflow Orchestration Platform — production stack
# =============================================================================
#   cp .env.example .env              # set POSTGRES_PASSWORD and at least one LLM API key
#   docker compose -f docker-compose.prod.yml up -d --build
#   open http://localhost             # (HTTP_PORT, default 80)
#
# Only nginx is published; Postgres and the backend stay on the internal network.
# Migrations run automatically when the backend starts.
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg15      # Postgres 15 with the pgvector extension (semantic cache)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_orchestrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-ai_orchestrator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_orchestrator}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_orchestrator}
      ENVIRONMENT: production
      # Same-origin behind nginx; add your public origin(s) if the UI is served elsewhere
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"     # with the HTTPS server block in nginx/nginx.conf
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/app.locations:/etc/nginx/conf.d/app.locations:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
