<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Orchestrator Database Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .db-info {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        select {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }
        
        .content {
            padding: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        td {
            padding: 12px 15px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .expandable {
            cursor: pointer;
            color: #667eea;
        }
        
        .expandable:hover {
            text-decoration: underline;
        }
        
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2em;
            cursor: pointer;
            color: #6c757d;
        }
        
        .modal-close:hover {
            color: #000;
        }
        
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗄️ Database Viewer</h1>
            <div class="db-info">
                PostgreSQL: localhost:5433/ai_orchestrator
            </div>
        </header>
        
        <div class="controls">
            <select id="tableSelect" onchange="loadTable()">
                <option value="">Select a table...</option>
            </select>
            <button class="btn btn-primary" onclick="loadTable()">Load Table</button>
            <button class="btn btn-secondary" onclick="loadAllStats()">Show Stats</button>
            <div class="search-box">
                <input type="text" id="searchBox" placeholder="Search in table..." onkeyup="searchTable()">
            </div>
        </div>
        
        <div class="content">
            <div id="statsContainer" class="stats" style="display: none;"></div>
            <div id="tableContainer"></div>
        </div>
    </div>
    
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>
    
    <script>
        const dbData = {
            tables: ['alembic_version', 'cache_entries', 'execution_records', 'model_profiles', 
                     'routing_decisions', 'routing_rules', 'stage_dependencies', 'stages', 
                     'workflow_context', 'workflows'],
            workflows: 25,
            stages: 46,
            executions: 46,
            cacheEntries: 39,
            stats: {
                totalWorkflows: 25,
                completedWorkflows: 25,
                totalStages: 46,
                totalExecutions: 46,
                cacheHits: 39,
                avgCacheHitRate: '85%'
            }
        };
        
        // Initialize
        window.onload = function() {
            const select = document.getElementById('tableSelect');
            dbData.tables.forEach(table => {
                const option = document.createElement('option');
                option.value = table;
                option.textContent = table;
                select.appendChild(option);
            });
            loadAllStats();
        };
        
        function loadAllStats() {
            const container = document.getElementById('statsContainer');
            container.style.display = 'grid';
            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${dbData.workflows}</div>
                    <div class="stat-label">Total Workflows</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${dbData.stages}</div>
                    <div class="stat-label">Total Stages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${dbData.executions}</div>
                    <div class="stat-label">Executions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${dbData.cacheEntries}</div>
                    <div class="stat-label">Cache Entries</div>
                </div>
            `;
            document.getElementById('tableContainer').innerHTML = 
                '<p style="text-align: center; color: #6c757d; font-size: 1.2em; padding: 40px;">Select a table to view its records</p>';
        }
        
        function loadTable() {
            const tableName = document.getElementById('tableSelect').value;
            if (!tableName) return;
            
            const container = document.getElementById('tableContainer');
            document.getElementById('statsContainer').style.display = 'none';
            
            container.innerHTML = `
                <h2 style="margin-bottom: 20px;">Table: ${tableName}</h2>
                <p style="color: #6c757d; margin-bottom: 20px;">
                    Connect to database to view live records. Run: <code>python view_database.py</code>
                </p>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Info</th><th>Status</th><th>Timestamp</th></tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" style="text-align: center; padding: 40px;">
                                Use the Python viewer script to see actual data
                            </td></tr>
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        function searchTable() {
            const input = document.getElementById('searchBox').value.toLowerCase();
            const table = document.querySelector('tbody');
            if (!table) return;
            
            const rows = table.getElementsByTagName('tr');
            for (let row of rows) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            }
        }
        
        function showDetail(content) {
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<pre>' + JSON.stringify(JSON.parse(content), null, 2) + '</pre>';
            modal.classList.add('active');
        }
        
        function closeModal(event) {
            if (!event || event.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        }
    </script>
</body>
</html>
