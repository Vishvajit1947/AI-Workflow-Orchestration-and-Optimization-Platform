[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: end-to-end integration tests
    performance: performance benchmarks
    requires_openai: needs a real OPENAI_API_KEY (skipped otherwise)
    e2e: live tests against real LLM providers (skipped without API keys)
