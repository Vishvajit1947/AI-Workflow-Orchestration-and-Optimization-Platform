[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Use the sync DB URL (Alembic doesn't support asyncpg directly in all modes)
# This is overridden in env.py from settings, but serves as fallback
sqlalchemy.url = postgresql+psycopg2://orchestrator:orchestrator_dev@localhost:5433/ai_orchestrator

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
